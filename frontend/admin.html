<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCOPE · Admin Dashboard</title><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/logo.png">
<style>
:root{--navy:#0f2a43;--navy2:#16385a;--ink:#1b2a38;--teal:#0f8b8d;--teal-d:#0b6e70;--blue:#1d5a85;--mut:#64748b;--line:rgba(15,42,67,.09);--ok:#16a34a;--bad:#dc2626;--warn:#d97706;
--glass:rgba(255,255,255,.66);--sh:0 10px 34px rgba(15,42,67,.09),inset 0 1px 0 rgba(255,255,255,.95)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
background:#e6eefa}
.hidden{display:none!important}button{font:inherit;cursor:pointer}h1,h2,h3,h4{margin:0;color:var(--navy);letter-spacing:-.01em}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:var(--sh)}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 28px;background:linear-gradient(135deg,rgba(15,42,67,.97),rgba(22,56,90,.95));backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(15,42,67,.25)}
.brand{display:flex;align-items:center;gap:11px;color:#fff}.lg{width:40px;height:40px;border-radius:50%;overflow:hidden;background:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(25,179,181,.45)}.lg img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
.brand b{font-size:17px;letter-spacing:.06em}.brand small{display:block;font-size:10.5px;letter-spacing:.14em;color:#9fc4de;margin-top:-2px}
nav{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);margin-left:14px}
nav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:#bcd3e6;padding:8px 18px;border-radius:999px;font-weight:600;font-size:13.5px;transition:.25s;white-space:nowrap}
nav button svg{width:16px;height:16px}nav button:hover{color:#fff}nav button.on{background:linear-gradient(135deg,#19b3b5,#1d78b5);color:#fff;box-shadow:0 4px 14px rgba(25,179,181,.4)}
.sp{flex:1}.live{display:flex;align-items:center;gap:8px;color:#b5d0e4;font-size:12.5px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07)}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pl 1.8s infinite}.dot.off{background:#f87171;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.out{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:7px 15px;font-weight:600;font-size:13px;transition:.2s}.out:hover{background:rgba(255,255,255,.2)}
main{max-width:1480px;margin:auto;padding:26px 28px 50px}
.pt{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}.pt h2{font-size:24px;font-weight:800}.pt p{margin:2px 0 0;color:var(--mut)}
/* stat cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:22px}
.st{padding:22px 24px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.st:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(15,42,67,.14),inset 0 1px 0 #fff}
.st:after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(15,139,141,.16),transparent 70%)}
.ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(15,42,67,.2)}.ic svg{width:26px;height:26px}
.g1{background:linear-gradient(135deg,#1d78b5,#16385a)}.g2{background:linear-gradient(135deg,#34d399,#0f8b8d)}.g3{background:linear-gradient(135deg,#8b7bf0,#3a56c5)}
.st .l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.st .n{font-size:36px;font-weight:800;color:var(--navy);line-height:1.1;margin:2px 0}.st .s{font-size:12.5px;color:var(--mut)}
/* overview grid */
.ov{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:20px;align-items:stretch}
.panel{padding:22px 24px;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ph h3{font-size:16px}.ph p{margin:1px 0 0;color:var(--mut);font-size:12.5px}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(15,42,67,.07)}.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut);transition:.2s}.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 2px 8px rgba(15,42,67,.12)}
#chart{position:relative;flex:1;min-height:300px}#chart svg{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:#7a8ea1;font-size:11px}svg .gl{stroke:rgba(15,42,67,.08)}.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;transform:translate(-50%,-110%);white-space:nowrap;box-shadow:0 8px 20px rgba(15,42,67,.3);opacity:0;transition:opacity .15s;z-index:3}
.cm{display:flex;gap:22px;margin-bottom:6px}.cm div{font-size:12px;color:var(--mut)}.cm b{display:block;font-size:20px;color:var(--navy)}
/* feed */
.feed{flex:1;overflow-y:auto;max-height:420px;margin:0 -8px;padding:0 8px}.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-thumb{background:rgba(15,42,67,.18);border-radius:9px}
.fi{display:flex;gap:12px;padding:11px 10px;border-radius:12px;transition:background .2s}.fi:hover{background:rgba(15,139,141,.07)}.fi.new{animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(-12px);background:rgba(15,139,141,.2)}to{opacity:1;transform:none}}
.fic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(15,139,141,.12);color:var(--teal-d)}.fic svg{width:17px;height:17px}
.fic.t-upload{background:rgba(217,119,6,.13);color:var(--warn)}.fic.t-prediction{background:rgba(139,123,240,.16);color:#5b46d6}.fic.t-logout{background:rgba(100,116,139,.15);color:var(--mut)}.fic.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.fm{min-width:0;flex:1;font-size:13.5px}.fm .d{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fm .t{color:#8799ab;font-size:11.5px}
/* boxes / tables */
.box{overflow:hidden}.bh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.bh h3{font-size:16px;flex:1;min-width:150px}
input,select{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid rgba(15,42,67,.14);border-radius:10px;padding:8px 12px;font:inherit;min-width:0;transition:.15s}input:focus,select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,139,141,.18)}
input[type=search],input[data-f=q]{min-width:220px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:12px 18px;white-space:nowrap;background:rgba(15,42,67,.035);font-weight:700}th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--teal-d)}th .ar{color:var(--teal)}
td{padding:13px 18px;border-top:1px solid var(--line);vertical-align:middle}tbody tr{transition:background .15s}tbody tr:hover{background:rgba(15,139,141,.06)}tr.clk{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.p-ok{background:rgba(22,163,74,.13);color:#15803d}.p-bad{background:rgba(220,38,38,.12);color:#b91c1c}.p-warn{background:rgba(217,119,6,.14);color:#b45309}.p-mu{background:rgba(100,116,139,.14);color:#475569}.p-in{background:rgba(15,139,141,.13);color:var(--teal-d)}
.mu{color:var(--mut)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.empty{padding:44px;text-align:center;color:var(--mut)}
.btn{background:linear-gradient(135deg,#12a0a2,#1d6ea8);color:#fff;border:0;border-radius:9px;padding:7px 14px;font-weight:600;font-size:12.5px;box-shadow:0 4px 12px rgba(15,139,141,.3);transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,139,141,.38)}
.btn.g{background:rgba(255,255,255,.9);color:var(--navy);box-shadow:0 1px 4px rgba(15,42,67,.14)}
.pg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:13px 22px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}.pg div{display:flex;gap:8px;align-items:center}.pg select{padding:4px 8px;width:auto}
.pg button{background:rgba(255,255,255,.9);color:var(--navy);border:1px solid rgba(15,42,67,.14);border-radius:8px;padding:5px 12px;font-weight:600}.pg button:disabled{opacity:.4;cursor:default}
.gdot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18);flex:none}
.rlink{background:none;border:0;padding:0;font-weight:700;color:var(--navy);cursor:pointer;text-decoration:none}.rlink:hover{color:var(--teal-d);text-decoration:underline}
.dsw{display:flex;flex-direction:column;gap:5px;align-items:flex-start;max-width:300px}.dsl{display:flex;flex-direction:column;gap:2px;align-items:flex-start;max-height:150px;overflow-y:auto;width:100%}.dsl:not(.open){overflow:hidden}.more{background:none;border:0;padding:0;color:var(--teal-d);font-size:12px;font-weight:700;cursor:pointer}.more:hover{text-decoration:underline}.dsl button{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:12.5px;text-align:left;cursor:pointer;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dsl button:hover{color:var(--teal-d);text-decoration:underline}
.who{display:flex;align-items:center;gap:10px;font-weight:700}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#19b3b5,#1d5a85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
/* drawer */
#veil{position:fixed;inset:0;background:rgba(15,42,67,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:40}#veil.on{opacity:1;pointer-events:auto}
#drw{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;z-index:41;transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-radius:22px 0 0 22px;background:rgba(244,248,252,.93)}#drw.on{transform:none}
.dh{padding:22px 24px 16px;border-bottom:1px solid var(--line)}.dh .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.x{border:0;background:rgba(15,42,67,.08);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--navy)}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.ms div{background:#fff;border-radius:12px;padding:9px 11px;box-shadow:0 1px 4px rgba(15,42,67,.08)}.ms b{display:block;font-size:19px;color:var(--navy)}.ms span{font-size:11px;color:var(--mut)}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 4px}.df select,.df input{flex:1;min-width:120px;padding:7px 10px}
.dl{flex:1;overflow-y:auto;padding:6px 24px}.dp{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px}
.dp button{background:#fff;border:1px solid rgba(15,42,67,.14);border-radius:8px;padding:5px 12px;font-weight:600;color:var(--navy)}.dp button:disabled{opacity:.4}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:10px 0 18px}.kv span:nth-child(odd){color:var(--mut)}
#mod{position:fixed;inset:0;background:rgba(15,42,67,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}#mod>div{max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:26px;background:rgba(255,255,255,.95)}
#toasts{position:fixed;top:78px;right:20px;z-index:70;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ts{display:flex;gap:11px;align-items:center;max-width:340px;padding:11px 15px;border-radius:14px;background:rgba(15,42,67,.95);color:#fff;font-size:13px;box-shadow:0 12px 30px rgba(15,42,67,.35);animation:tin .4s ease;transition:.4s}.ts.o{opacity:0;transform:translateX(30px)}.ts .fic{background:rgba(255,255,255,.14);color:#7ee7e8}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.ov{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.feed{max-height:340px}header{flex-wrap:wrap;gap:10px;padding:10px 14px}nav{order:3;width:100%;margin:0;overflow-x:auto}.sp{display:none}.live{margin-left:auto}main{padding:18px 14px 40px}}
@media(max-width:560px){.ms{grid-template-columns:repeat(2,1fr)}.st .n{font-size:30px}#drw{border-radius:0}.bh{padding:14px}input[data-f=q]{min-width:0;width:100%}}

/* ===== admin background: soft aurora light + engineering grid + flowing contour waves (light, calm, no particles) ===== */
body{background:linear-gradient(180deg,#f3f8fe 0%,#e8f1fc 55%,#e1ecfa 100%)}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgfx i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
#bgfx .a1{width:620px;height:620px;left:-140px;top:-160px;background:radial-gradient(circle,rgba(47,125,225,.34),transparent 68%);animation:aur1 22s ease-in-out infinite alternate}
#bgfx .a2{width:680px;height:560px;right:-160px;top:-60px;background:radial-gradient(circle,rgba(25,192,184,.30),transparent 68%);animation:aur2 26s ease-in-out infinite alternate}
#bgfx .a3{width:760px;height:520px;left:32%;bottom:-260px;background:radial-gradient(circle,rgba(110,120,240,.26),transparent 68%);animation:aur3 30s ease-in-out infinite alternate}
#bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(47,100,185,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,100,185,.07) 1px,transparent 1px);background-size:48px 48px;
 -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 0,transparent 100%);mask-image:radial-gradient(ellipse 80% 70% at 50% 35%,#000 0,transparent 100%)}
#bgfx .wv{position:absolute;left:0;bottom:0;width:200%;height:34vh;min-height:220px;animation:wvx 70s linear infinite;will-change:transform}
@keyframes wvx{to{transform:translateX(-50%)}}
@keyframes aur1{to{transform:translate3d(180px,120px,0) scale(1.15)}}
@keyframes aur2{to{transform:translate3d(-200px,140px,0) scale(1.1)}}
@keyframes aur3{to{transform:translate3d(-220px,-60px,0) scale(1.18)}}
@media(prefers-reduced-motion:reduce){#bgfx i,#bgfx .wv{animation:none}}
.glass{background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 34px rgba(30,80,160,.10),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
header{-webkit-backdrop-filter:none;backdrop-filter:none}
</style></head><body>

const P=s=>String(s).replace(" ","T"),NOW=()=>D&&D.server_time?new Date(P(D.server_time)).getTime():Date.now(),ago=t=>{if(!t)return"—";const s=Math.max(0,(NOW()-new Date(P(t)))/1e3);if(s<10)return"just now";if(s<60)return Math.floor(s)+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"};

 if(s<60)return"just now";const m=Math.floor(s/60);if(m<60)return f(m,"minute");const h=Math.floor(m/60);if(h<24)return f(h,"hour");const d=Math.floor(h/24);if(d<7)return f(d,"day");
 if(d<30)return f(Math.floor(d/7),"week");return f(Math.max(1,Math.floor(d/30)),"month")};

/* patch: update only when changed; keep focus + scroll */
function patch(el,html){if(el._h===html)return false;const a=document.activeElement,k=a&&el.contains(a)&&a.dataset&&a.dataset.f,pos=k&&a.selectionStart,sc=[...el.querySelectorAll(".tw,.dl")].map(e=>e.scrollTop);
 el.innerHTML=el._h=html;el.querySelectorAll(".tw,.dl").forEach((e,i)=>e.scrollTop=sc[i]||0);
 if(k){const n=el.querySelector(`[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}return true}
function tween(el,to){const from=+el.dataset.v||0;el.dataset.v=to;if(from===to||!window.requestAnimationFrame){el.textContent=to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* tables: cols = [label, render, sortValue] */
function table(cols,rows,clk){
 if(SORT.i!=null){const f=cols[SORT.i][2];rows=[...rows].sort((a,b)=>{const x=f(a),y=f(b);return(x>y?1:x<y?-1:0)*SORT.d})}

const tools=o=>`<div class="bh"><h3>${o.title}</h3>${o.status?`<select data-f="status"><option value="">All statuses</option>${o.status.map(s=>`<option ${F.status===s?"selected":""}>${s}</option>`).join("")}</select>`:""}${o.date?`<input type="date" data-f="from" value="${F.from}" title="From"><input type="date" data-f="to" value="${F.to}" title="To">`:""}${o.ph?`<input data-f="q" placeholder="${o.ph}" value="${esc(F.q)}">`:""}</div>`;

/* smooth monotone curve */
function curve(P){const n=P.length,d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]);m[0]=d[0];m[n-1]=d[n-2];
 for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0}else{const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}}
 let p=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<n-1;i++){const h=(P[i+1][0]-P[i][0])/3;p+=`C${P[i][0]+h},${P[i][1]+m[i]*h} ${P[i+1][0]-h},${P[i+1][1]-m[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}return p}
function chart(tr){const W=760,H=320,L=36,R=14,T=18,B=30,v=tr.values,n=v.length,mx=Math.max(...v,0),step=Math.max(1,Math.ceil(mx*1.2/4)),top=step*4;
 const X=i=>L+(W-L-R)*i/(n-1),Y=x=>T+(H-T-B)*(1-x/top),pts=v.map((x,i)=>[X(i),Y(x)]),ln=curve(pts),ev=Math.ceil(n/8);
 return `<svg viewBox="0 0 ${W} ${H}" id="csv"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19b3b5" stop-opacity=".42"/><stop offset="1" stop-color="#19b3b5" stop-opacity="0"/></linearGradient><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1d78b5"/><stop offset="1" stop-color="#19b3b5"/></linearGradient></defs>
 ${[0,1,2,3,4].map(i=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(step*i)}" y2="${Y(step*i)}" stroke-dasharray="${i?"4 5":""}"/><text x="${L-8}" y="${Y(step*i)+4}" text-anchor="end">${step*i}</text>`).join("")}
 ${tr.labels.map((l,i)=>i%ev===0||i===n-1&&n<9?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:"").join("")}
 <path d="${ln}L${X(n-1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?5.5:3}" fill="#fff" stroke="#14a3a6" stroke-width="2.2"/>`).join("")}
 <line id="cx" y1="${T}" y2="${H-B}" stroke="#14a3a6" stroke-dasharray="3 4" opacity="0"/></svg><div class="tip" id="tip"></div>`}
function hover(tr){const s=$("csv");if(!s)return;const W=760,L=36,R=14,n=tr.values.length;
 s.onmousemove=e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-L)/(W-L-R)*(n-1)))),px=(L+(W-L-R)*i/(n-1))/W*r.width,c=$("cx");
  c.setAttribute("x1",L+(W-L-R)*i/(n-1));c.setAttribute("x2",L+(W-L-R)*i/(n-1));c.setAttribute("opacity",1);const t=$("tip");t.style.opacity=1;t.style.left=px+"px";t.style.top="30px";t.innerHTML=`<b>${tr.values[i]}</b> active user${tr.values[i]===1?"":"s"} · ${esc(tr.labels[i])}`};
 s.onmouseleave=()=>{$("cx").setAttribute("opacity",0);$("tip").style.opacity=0}}

function renderOverview(){const s=D.stats,tr=D.trend[RANGE],tdy=D.server_time.slice(0,10),newU=D.users.filter(u=>(u.registered||"").startsWith(tdy)).length;
 if(BUILT!=="overview"){patch($("main"),"");$("main")._h=null;$("main").innerHTML=`${head("Overview")}
 <div class="cards"><div class="glass st"><div class="ic g1">${svg("users")}</div><div><div class="l">Total registered users</div><div class="n" id="c1">0</div></div></div>

  $("seg").onclick=e=>{const b=e.target.closest("button");if(b){RANGE=b.dataset.r;renderOverview()}};BUILT="overview"}

const V={
users(){const r=D.users.filter(u=>hit([u.roll,u.dataset_list.map(d=>d.name)],F.q));
 return head("Users")+`<div class="glass box">${tools({title:`Registered users (${r.length})`,ph:"Search roll no. or dataset…"})}${table([

function bind(m){m.querySelectorAll("[data-f]").forEach(e=>e.oninput=e.onchange=()=>{F[e.dataset.f]=e.value;PG.n=1;render()});

/* open a user's account in the normal user interface, read-only (new tab) */
async function openView(roll,ds){const w=window.open("about:blank","_blank");
 try{const r=await fetch("/api/admin/users/"+encodeURIComponent(roll)+"/view-token",{...AH,method:"POST"});if(r.status===401||r.status===403){if(w)w.close();return bye()}if(!r.ok)throw 0;
  const j=await r.json(),url="/#view="+encodeURIComponent(j.token)+"&roll="+encodeURIComponent(roll)+(ds?"&ds="+ds:"");if(w)w.location.href=url;else location.href=url}
 catch(e){if(w)w.close();alert("Could not open that account. Please try again.")}}
/* per-user history drawer */
function openUser(r){DR={roll:r,type:"",from:"",to:"",page:1};DD=null;$("veil").classList.add("on");$("drw").classList.add("on");$("drw")._h=null;loadUser();renderDrawer()}
function closeUser(){DR=null;$("veil").classList.remove("on");$("drw").classList.remove("on")}
async function loadUser(){if(!DR)return;try{const r=await fetch("/api/admin/users/"+encodeURIComponent(DR.roll)+"/activity",AH);if(r.status===401||r.status===403)return bye();if(r.ok){DD=await r.json();renderDrawer()}}catch(e){}}
function renderDrawer(){if(!DR)return;const u=D.users.find(x=>x.roll===DR.roll)||{};if(!DD){patch($("drw"),'<div class="empty">Loading…</div>');return}
 const all=DD.activity.filter(a=>(!DR.type||a.type===DR.type)&&inR(a.created_at,DR)),pages=Math.max(1,Math.ceil(all.length/12));DR.page=Math.min(DR.page,pages);const v=all.slice((DR.page-1)*12,DR.page*12);
 const h=`<div class="dh"><div class="row"><div class="who" style="font-size:18px"><div>${esc(DR.roll)}<div style="font-weight:400;font-size:12px;color:var(--mut)">Last login ${esc(u.last_login||"—")} · last used ${ago(u.last_used)}</div></div></div><div style="display:flex;gap:8px;align-items:center">${u.active?pill("● Active","ok"):pill("Inactive","mu")}<button class="x" data-close>×</button></div></div>
 <div class="ms"><div><b>${u.logins??0}</b><span>Logins</span></div><div><b>${u.datasets??0}</b><span>Datasets</span></div><div><b>${u.predictions??0}</b><span>Predictions</span></div><div><b>${u.exports??0}</b><span>Exports</span></div></div></div>
 <div class="df"><select data-d="type"><option value="">All activities</option>${Object.entries(TL).map(([k,x])=>`<option value="${k}" ${DR.type===k?"selected":""}>${x}</option>`).join("")}</select><input type="date" data-d="from" value="${DR.from}"><input type="date" data-d="to" value="${DR.to}"></div>
 <div class="dl">${v.map(a=>{const m=msg(a);return`<div class="fi"><div class="${fic(a)}">${svg(a.type)}</div><div class="fm"><div>${esc(TL[a.type]||a.type)} ${pill(a.status,stc(a.status))}</div>${a.detail?`<div class="d" title="${esc(a.detail)}">${esc(a.detail)}</div>`:""}<div class="t">${esc(a.created_at)} · ${ago(a.created_at)}</div></div></div>`}).join("")||'<div class="empty">No activity found.</div>'}</div>
 <div class="dp"><span>${all.length} event${all.length===1?"":"s"}</span><div style="display:flex;gap:8px;align-items:center"><button data-dp="-1" ${DR.page<=1?"disabled":""}>‹</button>${DR.page} / ${pages}<button data-dp="1" ${DR.page>=pages?"disabled":""}>›</button></div></div>`;
 const d=$("drw");if(patch(d,h)){d.querySelector("[data-close]").onclick=closeUser;d.querySelectorAll("[data-d]").forEach(e=>e.oninput=e.onchange=()=>{DR[e.dataset.d]=e.value;DR.page=1;renderDrawer()});d.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>{DR.page+=+b.dataset.dp;renderDrawer()})}}
$("veil").onclick=closeUser;addEventListener("keydown",e=>{if(e.key==="Escape"){closeUser();$("mod").classList.add("hidden")}});

function detail(p){const kv=o=>`<div class="kv">${Object.entries(o).map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v==null?"—":typeof v==="number"?+v.toPrecision(5):v)}</span>`).join("")}</div>`,r=p.result;
 $("modc").innerHTML=`<h3 style="font-size:20px">${esc(p.formula)} ${pill(r.final,fin(r.final))}</h3><div class="mu" style="margin-top:4px">by <b>${esc(p.roll)}</b> · ${esc(p.created)} · ${esc(p.model)} · ${esc(p.dataset)}</div>
 <h4 style="margin-top:18px">Input cathode information</h4>${kv(p.inputs)}<h4>Prediction results</h4>${kv({"Predicted log10(k*)":r.pred_log,"Predicted k* (cm/s)":(+r.pred_k).toExponential(3),"Mahalanobis distance":r.dist,"Applicability domain":r.ad_result,"Ehull check":r.ehull_result,"ORR check":r.orr_result,"Est. cost (USD/kg)":r.cost,"Cost level":r.cost_result,"Final":r.final})}<button class="btn" onclick="document.getElementById('mod').classList.add('hidden')">Close</button>`;$("mod").classList.remove("hidden")}

function toast(a){const m=msg(a),t=document.createElement("div");t.className="ts";t.innerHTML=`<div class="${fic(a)}">${svg(a.type)}</div><div>${m.h}</div>`;$("toasts").appendChild(t);setTimeout(()=>t.classList.add("o"),4200);setTimeout(()=>t.remove(),4700)}
async function poll(){if(busy)return;busy=true;const dot=$("dot"),lt=$("lt");
 try{const r=await fetch("/api/admin/snapshot",AH);if(r.status===401||r.status===403)return bye();if(!r.ok)throw 0;
  D=await r.json();const top=D.activity.length?D.activity[0].id:0;
  if(SEEN!==null)D.activity.filter(a=>a.id>SEEN).reverse().slice(-3).forEach(toast);
  dot.classList.remove("off");lt.textContent="Live · "+D.server_time.slice(11);render();SEEN=top;if(DR)loadUser()}
 catch(e){dot.classList.add("off");lt.textContent="Reconnecting…"}finally{busy=false}}
$("out").onclick=bye;
if(!TK)bye();else{nav();poll();setInterval(poll,3000)}
